<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#0f1628"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.3"/>
    </linearGradient>
    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="#fff" opacity="0.7"/>
  <circle cx="200" cy="80" r="1" fill="#fff" opacity="0.5"/>
  <circle cx="350" cy="30" r="1.8" fill="#fff" opacity="0.6"/>
  <circle cx="500" cy="65" r="1.2" fill="#fff" opacity="0.4"/>
  <circle cx="650" cy="25" r="1" fill="#fff" opacity="0.8"/>
  <circle cx="780" cy="55" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="900" cy="35" r="1.3" fill="#fff" opacity="0.6"/>
  <circle cx="1050" cy="50" r="1" fill="#fff" opacity="0.7"/>
  <circle cx="1130" cy="75" r="1.6" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="250" r="1" fill="#fff" opacity="0.3"/>
  <circle cx="400" cy="270" r="1.4" fill="#fff" opacity="0.5"/>
  <circle cx="700" cy="260" r="1.2" fill="#fff" opacity="0.4"/>
  <circle cx="950" cy="275" r="1" fill="#fff" opacity="0.6"/>
  <circle cx="1100" cy="240" r="1.5" fill="#fff" opacity="0.3"/>
  <!-- Horizon line -->
  <line x1="0" y1="230" x2="1200" y2="230" stroke="#1e293b" stroke-width="0.5"/>
  <rect x="0" y="230" width="1200" height="70" fill="#0a0e1a" opacity="0.6"/>
  <!-- Moon surface dots -->
  <circle cx="100" cy="245" r="3" fill="#1e293b" opacity="0.5"/>
  <circle cx="250" cy="250" r="5" fill="#1e293b" opacity="0.4"/>
  <circle cx="500" cy="242" r="4" fill="#1e293b" opacity="0.3"/>
  <circle cx="800" cy="248" r="6" fill="#1e293b" opacity="0.4"/>
  <circle cx="1050" cy="244" r="3.5" fill="#1e293b" opacity="0.5"/>
  <!-- Title -->
  <text x="600" y="120" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="64" fill="url(#glow)" letter-spacing="12">COSMOSYY</text>
  <!-- Tagline -->
  <text x="600" y="165" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="400" font-size="18" fill="#94a3b8" letter-spacing="3">WALK WHERE THEY WALKED. FIND WHAT THEY LEFT BEHIND.</text>
  <!-- Accent line -->
  <rect x="450" y="185" width="300" height="1.5" rx="1" fill="#f59e0b" opacity="0.6"/>
  <!-- Sub badge -->
  <text x="600" y="215" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" fill="#64748b" letter-spacing="4">NASA SPACE APPS CHALLENGE 2026</text>
</svg>
